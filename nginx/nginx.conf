# Main nginx configuration
#
# For the TEST container — mounted at /etc/nginx/nginx.conf
# For PRODUCTION on Debian 12 — replace /etc/nginx/nginx.conf or
# include this from your existing nginx.conf.
#
# The plane.conf.template in nginx/templates/ is the site-specific
# server block; it is processed by envsubst at container start-up
# (or manually for production) and placed in conf.d/.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------
    # Logging
    # -------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------
    # Performance
    # -------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # -------------------------------------------------------
    # Upload size (must be >= FILE_SIZE_LIMIT in Plane env)
    # -------------------------------------------------------
    client_max_body_size 20M;

    # -------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/rss+xml
               application/atom+xml image/svg+xml;

    # -------------------------------------------------------
    # Include virtual-host blocks
    # Generated from templates/ by envsubst at container start.
    # -------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
